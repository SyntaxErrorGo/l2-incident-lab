map $http_x_request_id $correlation_id {
    default $http_x_request_id;
    ""      $request_id;
}


map "$request_method:$incident_mode" $orders_upstream {
    default           backend:8000;
    "POST:bad_gateway" 127.0.0.1:65535;
}

log_format incident_json escape=json
    '{"timestamp":"$time_iso8601",'
    '"level":"INFO",'
    '"service":"nginx",'
    '"message":"HTTP request completed",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status_code":$status,'
    '"request_id":"$correlation_id",'
    '"duration_seconds":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time"}';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log incident_json;
    error_log /var/log/nginx/error.log warn;

    location = /api/orders {
        auth_request /internal/incident-route;
        auth_request_set $incident_mode $upstream_http_x_incident_mode;

        resolver 127.0.0.11 valid=10s ipv6=off;
        proxy_pass http://$orders_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $correlation_id;
        proxy_read_timeout 3s;

        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $correlation_id always;
    }

    location = /internal/incident-route {
        internal;
        proxy_pass http://backend:8000/api/incidents/proxy-route;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Request-ID $correlation_id;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $correlation_id;
        proxy_read_timeout 3s;

        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $correlation_id always;
    }

    location = /metrics {
        proxy_pass http://backend:8000/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $correlation_id;

        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $correlation_id always;
    }
    
    location = /docs {
    proxy_pass http://backend:8000/docs;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
